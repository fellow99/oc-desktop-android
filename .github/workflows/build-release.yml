# build-release.yml —— tag 触发的自动构建与发布（需求 012-building-workflow）
#
# 规格链：specs/012-building-workflow/{spec,plan}.md · 口径源：README 快速开始 / docs/000-工程规划.md §14.3
#
# 触发：push v* tag（如 v0.12.1）→ 载荷五步门禁 + APK + GitHub Release
#       workflow_dispatch 手动触发（仅构建验证，不发布）
# 签名：secrets 可选注入（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD）；
#       未配置时回退 debug 签名 APK（可直接安装）。签名材料零入库（keystore.properties / *.keystore 已 gitignore）。
# 引擎：io.github.fellow99:node-bridge:0.2.0 + node-runtime:26.13.0 直接解析自 Maven Central（settings.gradle.kts 的
#       mavenLocal() 在 CI 为空目录，顺位落到 mavenCentral()）。
name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # gh-release：创建 Release 与上传附件（最小权限）

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: 载荷五步 → APK → Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM: ${{ github.workspace }}/upstream-opencode
    steps:
      # ── 检出 ────────────────────────────────────────────────────────────────
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 检出上游 opencode（锁定基线 6f0514052a / Branch_v2.4.1）
        uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: 6f0514052a3c859894ad01bb14cc14dda1e44b96
          path: upstream-opencode
          # 必须完整对象集：apply-patches 的 `rev-parse --short`（auto 长度）基线守卫
          # 依赖与本机一致的 abbrev 长度；shallow 对象集会缩短长度导致误杀。
          fetch-depth: 0

      # ── 工具链 ──────────────────────────────────────────────────────────────
      - name: Node 24（脚本执行 + smoke 门禁）
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: bun 1.4.2（上游 build-node 守卫要求 ^1.4.2）
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: JDK 17（AGP 8.9）+ Gradle 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 引擎 AAR 预取（Central → OC_NODE_RUNTIME_AAR / OC_NODE_PTY_AAR，verify-runtime 门禁输入；限流退避重试）
        run: |
          # Maven Central 对 hosted runner IP 偶发 429 限流（v2.4.1 首跑即命中，curl --retry 3 扛不住窗口期）：
          # 双 CDN 交替 + 指数退避，最多 10 次；AAR 完整性由后续 verify-runtime 按 runtime.lock.json 校验。
          # node-pty 与 node-runtime 逐字同版本（runtime.lock.json pty 配对）；载荷④时尚未跑过 Gradle，
          # pty AAR 不在缓存中，同样预取并以 OC_NODE_PTY_AAR 显式指定。
          fetch_aar() {
            out="$1"; base="$2"; attempt=1
            while [ "$attempt" -le 10 ]; do
              url=$([ $((attempt % 2)) -eq 0 ] \
                && echo "https://repo.maven.apache.org/maven2/$base" \
                || echo "https://repo1.maven.org/maven2/$base")
              if curl -fsSL --retry 2 -o "$out" "$url"; then
                echo "✓ $(basename "$out") 下载成功（第 $attempt 次，$url 源）"
                return 0
              fi
              echo "::warning::$(basename "$out") 下载失败（第 $attempt/10 次）—— 疑似 Maven Central 限流，退避后重试"
              rm -f "$out"
              sleep $(( attempt * 15 ))
              attempt=$((attempt + 1))
            done
            echo "::error::$(basename "$out") 下载持续失败（Maven Central 限流窗口过长？）—— 请稍后 re-run 本 tag"
            return 1
          }
          fetch_aar "$RUNNER_TEMP/node-runtime-26.13.0.aar" "io/github/fellow99/node-runtime/26.13.0/node-runtime-26.13.0.aar"
          fetch_aar "$RUNNER_TEMP/node-pty-26.13.0.aar" "io/github/fellow99/node-pty/26.13.0/node-pty-26.13.0.aar"
          sha256sum "$RUNNER_TEMP"/node-runtime-26.13.0.aar "$RUNNER_TEMP"/node-pty-26.13.0.aar
          echo "OC_NODE_RUNTIME_AAR=$RUNNER_TEMP/node-runtime-26.13.0.aar" >> "$GITHUB_ENV"
          echo "OC_NODE_PTY_AAR=$RUNNER_TEMP/node-pty-26.13.0.aar" >> "$GITHUB_ENV"

      # ── 载荷五步（scripts/* 零改动；任一步红即整流程失败）────────────────────
      - name: 载荷① apply-patches（基线守卫 + 幂等补丁）
        run: node scripts/apply-patches.mjs --repo "$UPSTREAM"

      - name: 载荷② build-opencode（bundle-only；目标与运行时锁一致）
        run: OPENCODE_DIR="$UPSTREAM" OPENCODE_NODE_TARGET=node26 node scripts/build-opencode.mjs

      - name: 载荷③ collect-plugins（三插件物化 + 断言）
        run: node scripts/collect-plugins.mjs

      - name: 载荷④ collect-opencode（tar.gz + 清单 → assets/）
        run: OPENCODE_DIR="$UPSTREAM" node scripts/collect-opencode.mjs

      - name: 载荷⑤ smoke-node26（host 门禁，全绿才打包）
        run: OPENCODE_DIR="$UPSTREAM" node scripts/smoke-node26.mjs

      # ── 签名材料注秘（可选；无 secrets → debug 签名兜底）────────────────────
      - name: 签名注秘（有 secrets → VARIANT=release；无 → debug）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            for v in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!v}" ]; then
                echo "::error::签名 secrets 部分配置：$v 为空 —— 请在仓库 Settings → Secrets 配齐 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 四项（或全部删除走 debug 兜底）"
                exit 1
              fi
            done
            echo "$KEYSTORE_BASE64" | base64 --decode > oc-desktop-android.keystore
            printf 'storeFile=oc-desktop-android.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "VARIANT=debug" >> "$GITHUB_ENV"
            echo "::notice::未配置签名 secrets —— 产出 debug 签名 APK（可直接安装）。发布正式签名包请配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 四个 secrets（keystore 用 base64 -w0 编码）。"
          fi

      # ── APK（Android SDK：hosted runner 预装且 license 已接受，缺组件由 AGP 自动补装）──
      - name: APK 构建（assembleRelease / assembleDebug）
        run: ./gradlew :app:assemble${VARIANT} --stacktrace

      # ── 产物收集 ────────────────────────────────────────────────────────────
      - name: 收集产物（重命名 + SHA-256 清单）
        run: |
          NAME="${GITHUB_REF_NAME:-manual}"
          APK="app/build/outputs/apk/${VARIANT,,}/app-${VARIANT,,}.apk"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" "dist/oc-desktop-android-${NAME}.apk"
          (cd dist && sha256sum "oc-desktop-android-${NAME}.apk" > "oc-desktop-android-${NAME}.apk.sha256")
          ls -l dist

      - name: 上传 artifact（无论是否发布均留存）
        uses: actions/upload-artifact@v4
        with:
          name: oc-desktop-android-${{ github.ref_name }}
          path: dist/

      # ── 发布（仅 v* tag 触发；workflow_dispatch 到此为止）────────────────────
      - name: GitHub Release（仅 refs/tags/v*）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OC Desktop Android ${{ github.ref_name }}
          body: >
            自动构建产物 · 引擎 node-runtime 26.13.0（arm64-v8a）·
            上游 opencode v2.4.1（基线 6f0514052a）·
            校验请比对附件 .sha256。
          files: |
            dist/*.apk
            dist/*.sha256
          generate_release_notes: true
