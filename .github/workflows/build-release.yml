# build-release.yml —— tag 触发的自动构建与发布（需求 001-building-workflow）
#
# 规格链：specs/001-building-workflow/{spec,plan}.md · 口径源：README 快速开始 / docs/000-工程规划.md §14.3
#
# 触发：push v* tag（如 v0.12.1）→ 载荷五步门禁 + APK + GitHub Release
#       workflow_dispatch 手动触发（仅构建验证，不发布）
# 签名：secrets 可选注入（KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD）；
#       未配置时回退 debug 签名 APK（可直接安装）。签名材料零入库（keystore.properties / *.keystore 已 gitignore）。
# 引擎：io.github.fellow99:node-bridge:0.2.0 + node-runtime:24.22.1 直接解析自 Maven Central（settings.gradle.kts 的
#       mavenLocal() 在 CI 为空目录，顺位落到 mavenCentral()）。
name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # gh-release：创建 Release 与上传附件（最小权限）

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: 载荷五步 → APK → Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM: ${{ github.workspace }}/upstream-opencode
    steps:
      # ── 检出 ────────────────────────────────────────────────────────────────
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 检出上游 opencode（锁定基线 a517687fde / Branch_v2.1.2）
        uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: a517687fde98a7329ada3ae644a01a9fc6c4e99e
          path: upstream-opencode
          # 必须完整对象集：apply-patches 的 `rev-parse --short`（auto 长度）基线守卫
          # 依赖与本机一致的 abbrev 长度；shallow 对象集会缩短长度导致误杀。
          fetch-depth: 0

      # ── 工具链 ──────────────────────────────────────────────────────────────
      - name: Node 24（脚本执行 + smoke 门禁）
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: bun 1.3.14（上游 bundle 构建；与本机实证版本一致）
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: JDK 17（AGP 8.9）+ Gradle 缓存
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ── 载荷五步（scripts/* 零改动；任一步红即整流程失败）────────────────────
      - name: 载荷① apply-patches（基线守卫 + 幂等补丁）
        run: node scripts/apply-patches.mjs --repo "$UPSTREAM"

      - name: 载荷② build-opencode（node24 target，bundle-only）
        run: OPENCODE_DIR="$UPSTREAM" OPENCODE_NODE_TARGET=node24 node scripts/build-opencode.mjs

      - name: 载荷③ collect-plugins（三插件物化 + 断言）
        run: node scripts/collect-plugins.mjs

      - name: 载荷④ collect-opencode（tar.gz + 清单 → assets/）
        run: OPENCODE_DIR="$UPSTREAM" node scripts/collect-opencode.mjs

      - name: 载荷⑤ smoke-node24（host 门禁，全绿才打包）
        run: OPENCODE_DIR="$UPSTREAM" node scripts/smoke-node24.mjs

      # ── 签名材料注秘（可选；无 secrets → debug 签名兜底）────────────────────
      - name: 签名注秘（有 secrets → VARIANT=release；无 → debug）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > oc-desktop-android.keystore
            printf 'storeFile=oc-desktop-android.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "VARIANT=release" >> "$GITHUB_ENV"
          else
            echo "VARIANT=debug" >> "$GITHUB_ENV"
            echo "::notice::未配置签名 secrets —— 产出 debug 签名 APK（可直接安装）。发布正式签名包请配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 四个 secrets（keystore 用 base64 -w0 编码）。"
          fi

      # ── APK（Android SDK：hosted runner 预装且 license 已接受，缺组件由 AGP 自动补装）──
      - name: APK 构建（assembleRelease / assembleDebug）
        run: ./gradlew :app:assemble${VARIANT} --stacktrace

      # ── 产物收集 ────────────────────────────────────────────────────────────
      - name: 收集产物（重命名 + SHA-256 清单）
        run: |
          NAME="${GITHUB_REF_NAME:-manual}"
          APK="app/build/outputs/apk/${VARIANT,,}/app-${VARIANT}.apk"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" "dist/oc-desktop-android-${NAME}.apk"
          (cd dist && sha256sum "oc-desktop-android-${NAME}.apk" > "oc-desktop-android-${NAME}.apk.sha256")
          ls -l dist

      - name: 上传 artifact（无论是否发布均留存）
        uses: actions/upload-artifact@v4
        with:
          name: oc-desktop-android-${{ github.ref_name }}
          path: dist/

      # ── 发布（仅 v* tag 触发；workflow_dispatch 到此为止）────────────────────
      - name: GitHub Release（仅 refs/tags/v*）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OC Desktop Android ${{ github.ref_name }}
          body: >
            自动构建产物 · 引擎 node-runtime 24.22.1（arm64-v8a）·
            上游 opencode v2.1.2（基线 a517687fde）·
            校验请比对附件 .sha256。
          files: |
            dist/*.apk
            dist/*.sha256
          generate_release_notes: true
